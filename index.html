<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Charakterbogen – Warhammer Fantasy</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/appicon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/appicon.png">
  <link rel="apple-touch-startup-image" href="img/splash.png">
  <meta name="theme-color" content="#111">

  <!-- Fonts: Fraktur-Schrift für Überschriften, Podkova für Fließtext -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Podkova&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/black-chancery" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/deutsch-gothic" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/cloister-black" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/old-english-text-mt" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/kingthings-petrock" rel="stylesheet">

  <!-- Styles: getrennte Stylesheets für Mobile und Desktop -->
  <link rel="stylesheet" href="css/style-mobile.css" media="(max-width: 1199px)">
  <link rel="stylesheet" href="css/style-desktop.css" media="(min-width: 1200px)">
  <link rel="stylesheet" href="css/management.css">
</head>
<body>
  <div id="splash-screen"></div>
  <!-- Passwortschutz Overlay -->
  <div id="password-overlay" class="overlay">
    <div class="overlay-content">
      <h2>🔒 <span data-i18n="access"></span></h2>
      <p data-i18n="password_prompt"></p>
      <input type="password" id="password-input" maxlength="20">
      <button id="password-submit" data-i18n="ok"></button>
    </div>
  </div>

  <!-- Hauptcontainer mit Titel -->
  <header>
    <h1 data-i18n="character_sheet"></h1>
  </header>

  <!-- Verwaltung zum Umschalten/Erstellen/Löschen von Charakteren -->
  <section id="character-management" class="character-management">
    <div class="top-row">
      <button id="cycle-character" class="icon-btn" data-i18n-title="select_char"></button><!-- wechselt durch vorhandene Charaktere -->
      <button id="new-character" class="icon-btn" data-i18n-title="create_char"></button><!-- legt basierend auf Char-Namen einen neuen Eintrag an -->
      <button id="delete-character" class="icon-btn" data-i18n-title="delete_char"></button><!-- entfernt aktuellen Charakter -->
      <button id="import-character" class="icon-btn" data-i18n-title="import"></button>
      <button id="export-character" class="icon-btn" data-i18n-title="export"></button>
      <button id="settings" class="icon-btn" data-i18n-title="settings"></button><!-- öffnet Einstellungen -->
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
    <div class="edition-controls">
      <label for="edition-select" data-i18n="edition"></label>
      <select id="edition-select"><option value="4e">WFRP 4e</option><option value="5e">WFRP 5e</option></select>
      <button id="transfer-character" type="button" data-i18n="transfer_character"></button>
      <button id="recover-character" type="button" data-i18n="recover_character" hidden></button>
    </div>
    <div id="load-error" class="rule-warning" role="alert" hidden>
      <p data-i18n="load_error"></p><button id="retry-load" type="button" data-i18n="retry_load"></button>
    </div>
    <details id="transfer-report" hidden><summary data-i18n="transfer_report"></summary><div id="transfer-report-body"></div></details>
    <div class="char-fields">
      <div id="current-character" class="current-character-field"></div>
    </div>
  </section>

  <main id="main-content">
    <!-- Sections werden dynamisch aus sections.js gerendert -->
  </main><!-- hier werden beim Start alle Bereiche eingefügt -->

  <footer>
    <p>⚔ Warhammer Fantasy Charakterbogen – Version 0.9.0</p><!-- einfache Fußzeile mit Version -->
  </footer>

  <!-- Scripts: Übersetzungen, Struktur und Logik -->
  <script src="js/translations.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/character-store.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/edition-ui.js"></script>
  <script src="js/offline.js"></script>
</body>
</html>
